# ============================================================
# OneBlockQuests - messages/messages.yml
# Tous les messages envoyés aux joueurs et aux admins.
# Placeholders disponibles selon le message : {player} {quest} {reward}
# {category} {number} {name} {description} {progress} {required} {percent}
# Après modification : /quetes reload
# ============================================================

prefix: "&8[&6Quêtes&8] &r"

welcome: "&7Bienvenue ! Ta première quête t'attend : tape &e/quetes&7."
quest-completed: "&a✔ Quête terminée : &f{quest} &7(+&6{reward}&7)"
category-completed: "&6★ Tu as terminé la catégorie {category}&6 !"
category-unlocked: "&a➜ Nouvelle catégorie débloquée : {category}"
all-finished: "&6★ Félicitations, tu as terminé toutes les quêtes !"

locked-quest: "&cCette quête est verrouillée."
locked-category: "&cCette catégorie est verrouillée."

# Affiché (sans préfixe) quand le joueur clique sur sa quête en cours
quest-details:
  - "&8&m                              "
  - "{category} &8#&f{number} &7- &f{name}"
  - "&f{description}"
  - "&7Progression : &a{progress}&7/&a{required}"
  - "&7Récompense : &6{reward}"
  - "&8&m                              "

bossbar-on: "&7Bossbar &aactivée&7."
bossbar-off: "&7Bossbar &cdésactivée&7."
bossbar-disabled: "&cLa bossbar est désactivée sur ce serveur."

reloaded: "&aConfiguration, messages, menus et quêtes rechargés."
no-permission: "&cTu n'as pas la permission."
players-only: "&cCette commande est réservée aux joueurs."
player-not-found: "&cJoueur introuvable (il doit être en ligne)."
unknown-category: "&cCatégorie inconnue."
invalid-number: "&cNuméro de quête invalide pour cette catégorie."
admin-done: "&aAction effectuée pour {player}."
admin-usage:
  - "&6/quetes admin reset <joueur>"
  - "&6/quetes admin set <joueur> <catégorie> <numéro>"
  - "&6/quetes admin complete <joueur>"
  - "&6/quetes admin sync <joueur>"
