name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # permet de lancer à la main (onglet Actions > Run workflow)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler
        run: mvn -B clean package

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: OneBlockQuests
          path: target/OneBlockQuests.jar
