# ============================================================
# OneBlockQuests - menus/main.yml  (menu principal : les catégories)
# Le slot et l'icône de chaque catégorie se règlent dans config/quests.yml.
# Icônes : MATERIAL, MATERIAL:customModelData ou nexo:id_item
# Placeholders : {category} {description} {done} {total} {status}
# Après modification : /quetes reload
# ============================================================

title: "&8Quêtes"
size: 36                          # multiple de 9, entre 9 et 54
filler: GRAY_STAINED_GLASS_PANE   # vide = pas de décor

# Objet qui résume la quête en cours
info:
  enabled: true
  slot: 31
  icon: COMPASS
  name: "&6Quête en cours"
  lore:
    - ""
    - "{category} &8#&f{number}"
    - "&f{name}"
    - "&7{description}"
    - ""
    - "&7Progression : &a{progress}&7/&a{required}"
    - "&7Récompense : &6{reward}"
    - ""
    - "&7Quêtes terminées : &f{completed}&7/&f{total}"

# Catégorie accessible (en cours ou terminée)
category:
  name: "{category}"
  lore:
    - "&7{description}"
    - ""
    - "&7Progression : &f{done}&7/&f{total}"
    - ""
    - "{status}"
  status-open: "&eClique pour ouvrir"
  status-done: "&a✔ Catégorie terminée !"

  # Catégorie pas encore atteinte : impossible de l'ouvrir
  locked:
    icon: BARRIER
    name: "&c✖ &7{category}"
    lore:
      - "&7Termine la catégorie précédente"
      - "&7pour la débloquer."
