# ============================================================
# OneBlockQuests - menus/main.yml  (menu principal : les catégories)
#
# Tu peux tout organiser comme tu veux : taille, titre, décor, slot / icône /
# nom / lore de chaque catégorie, et des objets libres (section "items").
# Après modification : /quetes reload
#
# Icônes : MATERIAL, MATERIAL:customModelData ou nexo:id_item
#   Plusieurs choix possibles avec | : "nexo:quest|BOOK" = l'item Nexo,
#   ou un livre si Nexo est absent ou si l'item n'existe pas.
# Slots : de 0 (haut gauche) à size-1. Ligne 1 = 0-8, ligne 2 = 9-17, etc.
# Couleurs : &a  &#RRGGBB  #RRGGBB  -  Placeholders PlaceholderAPI (%...%) acceptés.
# ============================================================

version: 2

title: "&8Quêtes"
size: 36                          # multiple de 9, entre 9 et 54
filler: GRAY_STAINED_GLASS_PANE   # remplit les slots vides ; vide = pas de décor

# --- Objets libres -------------------------------------------
# Chaque objet : slot (ou slots: [1, 2, 3]), icon, name, lore, amount, glow,
# enabled, action.
# action : NONE (rien), MAIN (menu principal), CLOSE (fermer),
#          COMMAND (+ "command: ..." exécutée par le joueur, {player} accepté)
# Placeholders : {category} {number} {name} {objective} {progress} {required}
#                {reward} {completed} {total} (quête en cours du joueur)
items:
  info:
    slot: 31
    icon: COMPASS
    name: "&6Quête en cours"
    lore:
      - ""
      - "{category} &8#&f{number}"
      - "&f{name}"
      - "&7{description}"
      - ""
      - "&7Progression : &a{progress}&7/&a{required}"
      - "&7Récompense : &6{reward}"
      - ""
      - "&7Quêtes terminées : &f{completed}&7/&f{total}"
  # Exemple de bouton "Fermer" (retire le # devant chaque ligne pour l'activer) :
  # close:
  #   slot: 35
  #   icon: BARRIER
  #   name: "&cFermer"
  #   action: CLOSE

# --- Emplacement de chaque catégorie ---------------------------
# Tu peux aussi redéfinir ici, pour UNE catégorie, tout ce qui est dans la
# section "category" ci-dessous (icon, name, lore, status-open, status-done,
# locked.icon, locked.name, locked.lore). Exemple :
#   debutant:
#     slot: 10
#     icon: nexo:quest_debutant
categories:
  debutant:
    slot: 10
  facile:
    slot: 12
  novice:
    slot: 14
  normal:
    slot: 16
  intermediaire:
    slot: 19
  complique:
    slot: 21
  difficile:
    slot: 23
  impossible:
    slot: 25

# --- Apparence commune à toutes les catégories -------------------
# Placeholders : {category} {description} {done} {total} {status}
category:
  icon: "nexo:quest|BOOK"
  name: "{category}"
  lore:
    - "&7{description}"
    - ""
    - "&7Progression : &f{done}&7/&f{total}"
    - ""
    - "{status}"
  status-open: "&eClique pour ouvrir"
  status-done: "&a✔ Catégorie terminée !"

  # Catégorie pas encore atteinte : impossible de l'ouvrir
  locked:
    icon: "nexo:quest|BARRIER"
    name: "&c✖ &7{category}"
    lore:
      - "&7Termine la catégorie précédente"
      - "&7pour la débloquer."
