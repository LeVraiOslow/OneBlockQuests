# ============================================================
# OneBlockQuests - config/quests.yml
# Chaque catégorie contient ses quêtes, dans l'ordre (1, 2, 3...).
#
# Types : BREAK, PLACE, KILL, CRAFT, FISH, BREED, ENCHANT, SMELT, WALK, SWIM
#   WALK : marcher (amount = nombre de blocs parcourus à pied)
#   SWIM : nager   (amount = nombre de blocs parcourus dans l'eau)
#   Pour WALK et SWIM, "target" est inutile (ou mets ANY).
#
# target : ANY, un nom de Material / EntityType, ou une liste.
#          Les jokers * sont acceptés (ex: *_LOG, DIAMOND_*).
# reward : argent donné à la fin de la quête.
# objective (facultatif) : texte court affiché dans la bossbar ("Casser 5 blés").
#          S'il est absent, la description est utilisée (sans le point final).
#
# L'emplacement et l'icône des catégories dans le menu se règlent dans
# menus/main.yml (section "categories").
# Couleurs : &a, &#RRGGBB et #RRGGBB sont acceptés.
#
# Exemples (à copier dans une catégorie, en respectant la numérotation) :
#
#   12:
#     name: Randonneur
#     description: Parcours 500 blocs à pied.
#     type: WALK
#     amount: 500
#     reward: 800
#   13:
#     name: Nageur
#     description: Nage sur 200 blocs.
#     type: SWIM
#     amount: 200
#     reward: 800
#
# Attention : insérer une quête au milieu décale les numéros suivants
# et donc la progression des joueurs. Ajoute plutôt à la fin d'une catégorie.
# Après modification : /quetes reload
# ============================================================
