name: OneBlockQuests
version: '${project.version}'
main: fr.oneblockquests.OneBlockQuestsPlugin
api-version: '26.2'
authors: [OneBlockQuests]
description: Système de quêtes linéaires par catégories pour OneBlock
softdepend: [PlaceholderAPI, Vault, LuckPerms, Nexo, CustomNameplates]
commands:
  quetes:
    description: Ouvre le menu des quêtes
    aliases: [quest, quets, quete, q]
    usage: /<command>
permissions:
  oneblockquests.use:
    description: Utiliser le menu des quêtes
    default: true
  oneblockquests.admin:
    description: Commandes d'administration des quêtes
    default: op
