# ============================================================
# OneBlockQuests - menus/category.yml  (menu d'une catégorie : les quêtes)
# Icônes : MATERIAL, MATERIAL:customModelData ou nexo:id_item
# Placeholders : {category} {number} {name} {description}
#                {progress} {required} {percent} {reward}
# Après modification : /quetes reload
# ============================================================

title: "&8Quêtes &7» &r{category}"
size: 54                          # multiple de 9, entre 9 et 54
filler: GRAY_STAINED_GLASS_PANE   # vide = pas de décor

# Emplacements des quêtes, dans l'ordre (la 1re quête va dans le 1er slot...).
# Une catégorie peut avoir autant de quêtes que de slots listés ici.
quest-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

back:
  slot: 49
  icon: ARROW
  name: "&cRetour"

quest:
  completed:
    icon: LIME_DYE
    name: "&a✔ Quête #{number} &7- &f{name}"
    lore:
      - "&7Quête terminée."

  current:
    icon: WRITABLE_BOOK
    name: "&e» Quête #{number} &7- &f{name}"
    lore:
      - ""
      - "&f{description}"
      - ""
      - "&7Progression : &a{progress}&7/&a{required} &8({percent}%)"
      - "&7Récompense : &6{reward}"
      - ""
      - "&eQuête en cours"

  # Les quêtes à venir ne révèlent ni nom ni description
  locked:
    icon: BARRIER
    name: "&c✖ &7Quête #{number}"
    lore:
      - "&7Termine la quête précédente"
      - "&7pour la débloquer."
